<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hajime — Learn Japanese</title>
  <meta name="description" content="Learn Japanese from zero with short, playful daily lessons.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hajime">
  <meta property="og:title" content="Hajime — Learn Japanese from zero">
  <meta property="og:description" content="Short, playful daily lessons: words, phrases, kana and kanji.">
  <meta property="og:url" content="https://tedtomato.github.io/learn-japanese/">
  <meta property="og:image" content="https://tedtomato.github.io/learn-japanese/icons/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f7f9fa">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hajime">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('hajime.progress.v1') || '{}').settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="view"></div>
  <nav id="nav" aria-label="Main"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal"></div>
  <noscript>Hajime needs JavaScript to run.</noscript>
</body>
</html>
