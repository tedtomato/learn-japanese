<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hajime — Learn languages</title>
  <meta name="description" content="Hajime — learn languages: Japanese, Chinese, French, Spanish, English. Short, playful daily lessons from zero.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hajime">
  <meta property="og:title" content="Hajime — learn languages from zero">
  <meta property="og:description" content="Japanese, Chinese, French, Spanish and English: short, playful daily lessons with words, phrases and spaced repetition.">
  <meta property="og:url" content="https://tedtomato.github.io/learn-japanese/">
  <meta property="og:image" content="https://tedtomato.github.io/learn-japanese/icons/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f7f9fa">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hajime">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load without blocking the first paint (media="print" until loaded); the page shows system fonts meanwhile. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800&display=swap"></noscript>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var keys = { ja: 'hajime.progress.v1', zh: 'hajime.zh.progress.v1', fr: 'hajime.fr.progress.v1', es: 'hajime.es.progress.v1', en: 'hajime.en.progress.v1' };
      var settings = JSON.parse(localStorage.getItem(keys[localStorage.getItem('hajime.course')] || keys.ja) || '{}').settings || {};
      var t = settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var size = { small: 95, large: 115, xlarge: 130 }[settings.textSize];
      if (size) document.documentElement.style.fontSize = size + '%';
    } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!--SPLASH-->
  <script>
    // The start screen above is only for touch devices (phones and tablets) and only on a fresh start (js/fx.js takes it over).
    try {
      var phone = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
      var skip = sessionStorage.getItem('hajime.skip-splash') === '1';
      var s = document.querySelector('.splash');
      if (s && (!phone || skip)) s.remove();
    } catch (e) {}
  </script>
  <div id="view"></div>
  <nav id="nav" aria-label="Main"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal"></div>
  <noscript>Hajime needs JavaScript to run.</noscript>
</body>
</html>
